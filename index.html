<!DOCTYPE html>
<html lang="ps">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shinwari AI</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111827;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}
header{
background:#2563eb;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}
#chat{
flex:1;
padding:15px;
overflow:auto;
}
.msg{
background:#1f2937;
padding:10px;
margin:10px 0;
border-radius:10px;
}
footer{
display:flex;
padding:10px;
background:#1f2937;
}
input{
flex:1;
padding:10px;
border:none;
border-radius:8px;
}
button{
margin-left:10px;
padding:10px 20px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
}
</style>
</head>

<body>

<header>🤖 Shinwari AI</header>

<div id="chat">
<div class="msg">سلام! Shinwari AI ته ښه راغلاست.</div>
</div>

<footer>
<input id="text" placeholder="خپل پیغام ولیکئ...">
<button onclick="send()">Send</button>
</footer>

<script>
function send(){
let input=document.getElementById("text");
let chat=document.getElementById("chat");

if(input.value=="") return;

chat.innerHTML += "<div class='msg'>👤 "+input.value+"</div>";

let reply="زه Shinwari AI یم. ستا پیغام مې ترلاسه کړ.";

chat.innerHTML += "<div class='msg'>🤖 "+reply+"</div>";

input.value="";
chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
